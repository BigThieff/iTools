<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="iTools macOS style icon">
  <!-- macOS style rounded rectangle background -->
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="1"/>
    </linearGradient>
    <!-- 内阴影效果 -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offset" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- macOS 圆角矩形背景 (22.5% 圆角) -->
  <rect x="32" y="32" width="960" height="960" rx="230" ry="230" 
        fill="url(#bgGradient)" 
        stroke="#e9ecef" 
        stroke-width="2"
        filter="url(#innerShadow)"/>
  
  <!-- 主图标 - "it" 字母组合 -->
  <g transform="translate(0, 50)">
    <!-- i 字母 -->
    <g fill="#3b82f6">
      <!-- i 的点 -->
      <circle cx="380" cy="320" r="45" opacity="0.9"/>
      <!-- i 的主体 -->
      <rect x="335" y="420" width="90" height="380" rx="45" ry="45" opacity="0.9"/>
    </g>
    
    <!-- t 字母 -->
    <g fill="#1d4ed8">
      <!-- t 的竖线 -->
      <rect x="520" y="380" width="90" height="420" rx="45" ry="45"/>
      <!-- t 的横线 -->
      <rect x="470" y="420" width="190" height="80" rx="40" ry="40"/>
    </g>
  </g>
  
  <!-- 装饰元素 - 视频/字幕相关的小图标 -->
  <g transform="translate(700, 200)" fill="#6b7280" opacity="0.3">
    <!-- 小视频图标 -->
    <rect x="0" y="0" width="60" height="40" rx="8" ry="8" stroke="#6b7280" stroke-width="3" fill="none"/>
    <circle cx="20" cy="20" r="8" fill="#6b7280"/>
  </g>
  
  <g transform="translate(200, 750)" fill="#6b7280" opacity="0.3">
    <!-- 字幕线条 -->
    <rect x="0" y="0" width="80" height="8" rx="4" ry="4"/>
    <rect x="0" y="20" width="120" height="8" rx="4" ry="4"/>
    <rect x="0" y="40" width="100" height="8" rx="4" ry="4"/>
  </g>
</svg>
